<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Portfólio - Robert Kleber</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      line-height: 1.6;
    }

    header {
      background: #333;
      color: #fff;
      padding: 1rem;
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 1rem;
    }

    nav a {
      color: #fff;
      text-decoration: none;
    }

    section {
      padding: 2rem;
    }

    #sobre {
      background: #f4f4f4;
    }

    #projetos {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1rem;
    }

    .card {
      background: #fff;
      padding: 1rem;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    footer {
      background: #333;
      color: #fff;
      text-align: center;
      padding: 1rem;
    }

    @media (max-width: 600px) {
      nav {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>

  <header>
    <nav>
      <h1>Meu Portfólio</h1>
      <ul>
        <li><a href="#sobre">Sobre</a></li>
        <li><a href="#projetos">Projetos</a></li>
      </ul>
    </nav>
  </header>

  <section id="sobre">
    <h2>Sobre Mim</h2>
    <p>Olá! Meu nome é Robert Kleber da Silva. Sou estudante, aspirante à desenvolvedor e trabalho com design, impressão e projetos digitais. Sou vila-novense nascido em Picos-PI.</p>
  </section>

  <section>
    <h2>Meus Projetos</h2>
    <div id="projetos"></div>
  </section>

  <footer>
    <p>© 2026 - Meu Portfólio</p>
  </footer>

  <script>
    const projetos = [
      {
        nome: "Sites de Rádios",
        descricao: "Web rádio com player online",
      },
      {
        nome: "Sistema de Bingos Computadorizados",
        descricao: "Imprimo e gerencio Cartelas de Bingo",
      },
      {
        nome: "Artes Gráficas",
        descricao: "Criação de banners, logos, Identidades visuais e materiais impressos, etc.",
      }
    ];

    const container = document.getElementById("projetos");

    projetos.forEach(projeto => {
      const card = document.createElement("div");
      card.classList.add("card");

      card.innerHTML = `
        <h3>${projeto.nome}</h3>
        <p>${projeto.descricao}</p>
      `;

      container.appendChild(card);
    });
  </script>

</body>
</html>
